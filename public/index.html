<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رياضيات المعلم</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="/ar/">
<script>
  // اللغة التي اختارها الزائر سابقًا، وإلا العربية
  var l = "ar";

  location.replace("/" + l + "/");
</script>
<noscript><meta http-equiv="refresh" content="0; url=/ar/"></noscript>
</head>
<body><a href="/ar/">العربية</a> · <a href="/en/">English</a></body>
