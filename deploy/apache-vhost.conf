# مثال VirtualHost — يتطلب: a2enmod http2 ssl headers rewrite deflate brotli
# HTTP/2 يحتاج mpm_event (لا يعمل مع mpm_prefork)؛ لتشغيل contact.php استخدم PHP-FPM.
<VirtualHost *:443>
    ServerName example.com
    DocumentRoot /var/www/riyadiyat-almoallem

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem

    <Directory /var/www/riyadiyat-almoallem>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName example.com
    Redirect permanent / https://example.com/
</VirtualHost>
